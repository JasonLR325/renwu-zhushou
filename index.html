<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="任务助手" />
  <meta name="description" content="个人任务管理与复盘提醒工具" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>任务助手</title>
</head>
<body>
  <div id="app">
    <!-- 顶部栏 -->
    <header class="app-header">
      <span class="app-header-title" id="header-title">任务助手</span>
      <div class="app-header-actions"></div>
    </header>

    <!-- 内容区 -->
    <main class="app-content" id="app-content"></main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="home">
        <span class="nav-item-icon">📋</span>
        <span class="nav-item-label">任务</span>
      </button>
      <button class="nav-item nav-item-add" id="fab-btn" aria-label="添加任务">
        <span class="nav-item-add-icon">＋</span>
      </button>
      <button class="nav-item" data-tab="settings">
        <span class="nav-item-icon">⚙️</span>
        <span class="nav-item-label">我的</span>
      </button>
    </nav>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
